<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎴 Anime Cards Game v8</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--bg4:#22222e;
  --border:#2e2e3e;--border2:#3a3a50;
  --text:#e8e8f0;--text2:#9090a8;--text3:#5a5a70;
  --cyan:#00e5ff;--gold:#ffd700;--green:#00c36a;--red:#e53935;--purple:#c340ff;
  --radius:12px;--radius-sm:8px;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);padding:0;min-height:100vh;overflow-x:hidden;}

/* ---- LAYOUT ---- */
#app{max-width:1100px;margin:0 auto;padding:12px;}
.page{display:none;}
.page.active{display:block;}

/* ---- TOPBAR ---- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:wrap;}
.topbar h1{font-size:1.2rem;color:var(--cyan);flex:1;white-space:nowrap;}
.topbar-btns{display:flex;gap:6px;flex-wrap:wrap;}

/* ---- BUTTONS ---- */
.btn{cursor:pointer;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;transition:all .15s;white-space:nowrap;}
.btn:hover{background:var(--bg4);border-color:#555;}
.btn-primary{background:#003a4a;border-color:var(--cyan);color:var(--cyan);}
.btn-primary:hover{background:#005060;}
.btn-danger{background:#3a0a0a;border-color:var(--red);color:var(--red);}
.btn-danger:hover{background:#4a1010;}
.btn-success{background:#003a20;border-color:var(--green);color:var(--green);}
.btn-success:hover{background:#004a28;}
.btn-sm{padding:3px 8px;font-size:11px;}
.btn-icon{padding:4px 8px;font-size:13px;}

/* ---- INPUTS ---- */
input[type=text],input[type=number],input[type=url],input[type=search],select,textarea{
  background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius-sm);
  padding:6px 10px;font-size:13px;outline:none;transition:border .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);}
input[type=checkbox]{accent-color:var(--cyan);width:14px;height:14px;cursor:pointer;}
input[type=file]{color:var(--text2);font-size:12px;}
label{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px;cursor:pointer;}

/* ---- GLOBAL STATS HERO ---- */
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0;}
.hero-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;text-align:center;}
.hero-card .num{font-size:1.6rem;font-weight:700;line-height:1;}
.hero-card .lbl{font-size:11px;color:var(--text2);margin-top:3px;}
.hero-card.c-cyan .num{color:var(--cyan);}
.hero-card.c-gold .num{color:var(--gold);}
.hero-card.c-green .num{color:var(--green);}
.hero-card.c-purple .num{color:var(--purple);}

/* ---- PROGRESS BARS ---- */
.pbar{height:8px;background:var(--bg4);border-radius:6px;overflow:hidden;margin-top:4px;}
.pfill{height:100%;border-radius:6px;background:var(--cyan);transition:width .5s cubic-bezier(.4,0,.2,1);}
.pfill.gold{background:var(--gold);}
.pfill.green{background:var(--green);}

/* ---- ANIME GRID ---- */
.anime-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:8px;}
.anime-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s;position:relative;}
.anime-card:hover{transform:translateY(-3px);border-color:var(--border2);}
.anime-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3);}
.anime-card .ac-body{padding:8px;}
.anime-card .ac-name{font-size:13px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.anime-card .ac-prog{font-size:11px;color:var(--text2);margin-bottom:3px;}
.anime-card .ac-actions{display:flex;gap:4px;margin-top:6px;justify-content:center;}
.anime-card.completed{border-color:var(--green);}
.anime-card.completed::after{content:"✓";position:absolute;top:6px;right:6px;background:var(--green);color:#fff;font-size:10px;font-weight:bold;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;}

/* ---- TABS ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{background:none;border:none;color:var(--text3);font-size:13px;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s;}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan);}
.tab:hover{color:var(--text);}

/* ---- TOOLBAR ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;padding:8px;background:var(--bg2);border-radius:var(--radius-sm);border:1px solid var(--border);}
.filter-chip{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:3px 10px;font-size:11px;cursor:pointer;transition:all .15s;color:var(--text2);}
.filter-chip.on{background:var(--bg3);border-color:var(--cyan);color:var(--cyan);}
.filter-chip.on.gold{border-color:var(--gold);color:var(--gold);}

/* ---- SECTION ---- */
.section-head{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);margin-bottom:8px;}
.section-head .sh-title{font-size:14px;font-weight:600;}
.section-head .sh-count{font-size:11px;color:var(--text2);margin-left:4px;}
.section-head .sh-pct{font-size:11px;color:var(--text3);}
.section-head .sh-arrow{margin-left:auto;font-size:11px;color:var(--text3);transition:transform .2s;}
.section-head.collapsed .sh-arrow{transform:rotate(-90deg);}
.section-body{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.section-body.hidden{display:none;}

/* ---- CARD ---- */
.card{width:175px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .2s;position:relative;cursor:default;}
.card:hover{transform:translateY(-2px);}
.card.shiny{border-color:#ffd700;box-shadow:0 0 14px rgba(255,215,0,.35);animation:shimmer 2.5s ease-in-out infinite alternate;}
.card.not-obtained{opacity:.7;}
@keyframes shimmer{from{box-shadow:0 0 8px rgba(255,215,0,.3);}to{box-shadow:0 0 22px rgba(255,215,0,.7),0 0 35px rgba(255,200,0,.3);}}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3);}
.card.poster-card img{aspect-ratio:2/3;object-fit:contain;}
.card img.gray{filter:grayscale(100%) brightness(.55);}
.card .card-body{padding:8px;}
.card .card-name{font-size:12px;font-weight:600;margin-bottom:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .card-tags{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:5px;flex-wrap:wrap;}
.card .pwr{font-size:11px;color:var(--text2);text-align:center;margin-bottom:3px;}
.card .card-actions{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:5px;}
.card .card-move{width:100%;font-size:11px;margin-top:4px;background:var(--bg3);color:var(--text2);}
.card .obtained-badge{position:absolute;top:5px;right:5px;background:var(--green);color:#fff;font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px;}
.card .new-badge{position:absolute;top:5px;left:5px;background:var(--cyan);color:#000;font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px;}
.card.dragging{opacity:.35;border-style:dashed;}

/* ---- RARITY BADGES ---- */
.rbd{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;}
.rbd.bronze{background:#3a1f05;color:#cd7f32;}
.rbd.silver{background:#252525;color:#c0c0c0;}
.rbd.gold{background:#2e2000;color:#ffd700;}
.rbd.diamond{background:#00203a;color:#00e5ff;}
.rbd.mythic{background:#1f0030;color:#c340ff;box-shadow:0 0 5px rgba(195,64,255,.4);}
.rbd.radiant{background:#150025;color:#ff88ff;animation:radglow 1.5s ease-in-out infinite alternate;}
@keyframes radglow{from{box-shadow:0 0 4px rgba(255,136,255,.3);}to{box-shadow:0 0 10px rgba(255,136,255,.7);}}

/* ---- RARITY DOT ---- */
.rdot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.rdot.bronze{background:#cd7f32;}
.rdot.silver{background:#c0c0c0;}
.rdot.gold{background:#ffd700;}
.rdot.diamond{background:#00e5ff;}
.rdot.mythic{background:#c340ff;}
.rdot.radiant{background:linear-gradient(135deg,#ff88ff,#00e5ff);}

/* ---- STATS PAGE ---- */
.stats-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
.stats-section h4{font-size:13px;color:var(--text2);margin-bottom:8px;}
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;}
.stat-row .sr-label{width:80px;color:var(--text2);}
.stat-row .sr-bar{flex:1;}
.stat-row .sr-val{min-width:60px;text-align:right;color:var(--text2);}
.trophy-list{display:flex;flex-direction:column;gap:6px;}
.trophy-item{display:flex;align-items:center;gap:8px;font-size:12px;}
.trophy-icon{font-size:16px;}

/* ---- FORM ---- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:8px;}
.form-group{display:flex;flex-direction:column;gap:3px;}
.form-group label{font-size:11px;color:var(--text2);}
.form-group input,.form-group select{width:100%;}
.form-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}

/* ---- CARD DETAIL MODAL ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:12px;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;max-width:380px;width:100%;overflow:hidden;}
.modal-img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3);}
.modal-body{padding:14px;}
.modal-name{font-size:1.2rem;font-weight:700;margin-bottom:6px;}
.modal-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center;}
.modal-pbar{margin-bottom:10px;}
.modal-actions{display:flex;gap:6px;flex-wrap:wrap;}

/* ---- CONFIRM DIALOG ---- */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:center;justify-content:center;}
.confirm-box{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:20px 24px;text-align:center;max-width:300px;}
.confirm-box p{margin-bottom:14px;font-size:14px;}
.confirm-btns{display:flex;gap:8px;justify-content:center;}

/* ---- TOAST ---- */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a2e;border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:normal;max-width:90vw;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.5);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---- SEARCH ANIME ---- */
.search-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
.search-bar input{flex:1;min-width:140px;}

/* ---- BACK HEADER ---- */
.back-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.back-header h2{font-size:1.1rem;flex:1;}
.anime-header-img{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--bg3);}

/* ---- EMPTY STATE ---- */
.empty{text-align:center;padding:30px;color:var(--text3);font-size:14px;}

/* ---- RECENTLY ADDED ---- */
.new-ring{border-color:var(--cyan) !important;box-shadow:0 0 10px rgba(0,229,255,.3);}

/* ---- VIEW TOGGLE ---- */
.view-toggle{display:flex;gap:4px;}
.view-btn{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:13px;color:var(--text2);}
.view-btn.active{background:var(--bg4);color:var(--text);border-color:var(--border2);}

/* ---- LIST VIEW ---- */
.card-list-item{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:5px;}
.cli-img{width:42px;height:42px;border-radius:6px;object-fit:cover;background:var(--bg3);flex-shrink:0;}
.cli-img.gray{filter:grayscale(100%) brightness(.5);}
.cli-info{flex:1;min-width:0;}
.cli-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cli-meta{font-size:11px;color:var(--text2);margin-top:2px;}
.cli-actions{display:flex;gap:4px;flex-shrink:0;}

/* ---- WISHLIST / PRIORITY ---- */
.card.wishlist { box-shadow: 0 0 14px rgba(255,165,0,.5); border-color: #ff9800 !important; }
.wish-badge { position:absolute;top:5px;left:5px;background:#ff9800;color:#000;font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px;z-index:2; }
/* ---- BULK SELECT ---- */
.card.bulk-selected { outline: 2px solid var(--cyan); outline-offset: 2px; }
.bulk-bar { display:none;position:sticky;bottom:0;z-index:50;background:var(--bg2);border-top:1px solid var(--cyan);padding:8px 12px;align-items:center;gap:10px;flex-wrap:wrap; }
.bulk-bar.visible { display:flex; }
/* ---- NOTES ---- */
.card-note { font-size:10px;color:var(--text3);text-align:center;margin-top:3px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
/* ---- GLOBAL SEARCH MODAL ---- */
#globalSearchModal .modal { max-width:600px; }
#globalSearchResults { max-height:60vh;overflow-y:auto; }
.gsr-item { display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s; }
.gsr-item:hover { background:var(--bg3); }
.gsr-img { width:36px;height:36px;border-radius:6px;object-fit:cover;background:var(--bg3);flex-shrink:0; }
.gsr-info { flex:1;min-width:0; }
.gsr-name { font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.gsr-meta { font-size:11px;color:var(--text2); }
/* ---- RANKING ---- */
.rank-item { display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px; }
.rank-num { width:22px;text-align:center;font-weight:700;color:var(--text3);font-size:11px; }
.rank-img { width:32px;height:32px;border-radius:5px;object-fit:cover;background:var(--bg3); }
.rank-name { flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.rank-pwr { font-size:11px;font-weight:700; }
/* ---- COLLECTOR LEVEL ---- */
.collector-level { display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:8px 14px;margin-top:8px; }
.cl-icon { font-size:1.4rem; }
.cl-info { flex:1; }
.cl-title { font-size:12px;font-weight:700; }
.cl-sub { font-size:10px;color:var(--text2); }
/* ---- DUPLICATE BADGE ---- */
.dup-badge { position:absolute;top:5px;left:5px;background:#e53935;color:#fff;font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px;z-index:2; }

@media(max-width:600px){
  .anime-grid{grid-template-columns:repeat(2,1fr);}
  .card{width:calc(50vw - 22px);}
  .hero-stats{grid-template-columns:repeat(2,1fr);}
  .form-grid{grid-template-columns:1fr;}
  .topbar h1{font-size:1rem;}
}

/* ====================================================
   ✨ MODO MEJORADO — Visual overhaul
   ==================================================== */
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

body.improved {
  --bg:#06060e;--bg2:#0d0d1f;--bg3:#131326;--bg4:#1a1a32;
  --border:#2a2a4a;--border2:#3a3a60;
  --text:#eeeeff;--text2:#9090cc;--text3:#5050a0;
  --cyan:#7df9ff;--gold:#ffe566;--green:#39ff14;--red:#ff3c5e;--purple:#d946ef;
  background: #06060e;
  font-family: 'Nunito', sans-serif;
}

/* Stars background */
body.improved::before {
  content:'';
  position:fixed;inset:0;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(125,249,255,0.5) 0%, transparent 0%),
    radial-gradient(1px 1px at 30% 40%, rgba(255,229,102,0.4) 0%, transparent 0%),
    radial-gradient(1.5px 1.5px at 55% 20%, rgba(125,249,255,0.6) 0%, transparent 0%),
    radial-gradient(1px 1px at 75% 60%, rgba(217,70,239,0.5) 0%, transparent 0%),
    radial-gradient(1px 1px at 90% 10%, rgba(125,249,255,0.4) 0%, transparent 0%),
    radial-gradient(1px 1px at 20% 80%, rgba(255,229,102,0.3) 0%, transparent 0%),
    radial-gradient(1.5px 1.5px at 65% 85%, rgba(125,249,255,0.5) 0%, transparent 0%),
    radial-gradient(1px 1px at 45% 70%, rgba(217,70,239,0.4) 0%, transparent 0%),
    radial-gradient(1px 1px at 85% 35%, rgba(255,229,102,0.5) 0%, transparent 0%);
  pointer-events:none;
  z-index:0;
}

body.improved .topbar {
  background: linear-gradient(135deg, rgba(13,13,31,0.97), rgba(20,10,40,0.97));
  border-bottom: 1px solid rgba(125,249,255,0.2);
  backdrop-filter: blur(12px);
  box-shadow: 0 2px 30px rgba(125,249,255,0.08);
}
body.improved .topbar h1 {
  font-family: 'Cinzel', serif;
  font-size: 1.3rem;
  background: linear-gradient(135deg, #7df9ff, #d946ef);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.04em;
}

/* Improved hero cards */
body.improved .hero-card {
  background: linear-gradient(135deg, rgba(13,13,31,0.9), rgba(20,10,50,0.9));
  border: 1px solid rgba(125,249,255,0.15);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  backdrop-filter: blur(6px);
}
body.improved .hero-card.c-cyan .num { 
  background: linear-gradient(135deg, #7df9ff, #00b4d8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip:text;
}
body.improved .hero-card.c-gold .num {
  background: linear-gradient(135deg, #ffe566, #f59e0b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip:text;
}

/* Improved anime cards */
body.improved .anime-card {
  background: linear-gradient(160deg, rgba(15,15,35,0.95), rgba(10,10,25,0.95));
  border: 1px solid rgba(125,249,255,0.1);
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  transition: transform .25s, box-shadow .25s, border-color .25s;
  overflow: visible;
}
body.improved .anime-card:hover {
  transform: translateY(-6px) scale(1.02);
  border-color: rgba(125,249,255,0.4);
  box-shadow: 0 12px 40px rgba(125,249,255,0.15);
}
body.improved .anime-card img { border-radius: 10px 10px 0 0; }

/* Improved card grid items */
body.improved .card {
  background: linear-gradient(160deg, rgba(15,15,40,0.98), rgba(8,8,20,0.98));
  border: 1px solid rgba(125,249,255,0.1);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  transition: transform .25s, box-shadow .25s;
  border-radius: 14px;
}
body.improved .card:hover {
  transform: translateY(-5px);
  box-shadow: 0 14px 40px rgba(125,249,255,0.12);
}
body.improved .card.shiny {
  border-color: rgba(255,229,102,0.6);
  box-shadow: 0 0 20px rgba(255,215,0,.4), 0 0 60px rgba(255,215,0,.1);
}
body.improved .card-name {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  letter-spacing: 0.02em;
}
body.improved .card .pwr {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  color: var(--text2);
  letter-spacing: 0.05em;
}

/* Improved buttons */
body.improved .btn {
  border-radius: 8px;
  font-family: 'Nunito', sans-serif;
  font-weight: 600;
  letter-spacing: 0.02em;
  transition: all .2s;
}
body.improved .btn-primary {
  background: linear-gradient(135deg, rgba(0,60,80,0.9), rgba(0,40,60,0.9));
  border-color: rgba(125,249,255,0.5);

<div id="toastEl" class="toast"></div>

<script>
// ===== STATE =====
let animes = [];
let currentAnime = null;
let editingAnime = null;
let editingCard = null;
let dragSrc = null;
let cardView = 'grid';
let filters = { missing: false, shiny: false, obtained: false, wishlist: false, dups: false, needsImage: false };
let newCards = new Set();
let lastEditedName = '';
let bulkMode = false;
let lastRejectedCodes = []; // códigos de la última importación rechazados por ser peores
let bulkSelected = new Set();
const RARITY_RANK = { bronze:1, silver:2, gold:3, diamond:4, mythic:5, radiant:6 };
const RARITY_LABELS = { bronze:'Bronce', silver:'Plata', gold:'Oro', diamond:'Diamante', mythic:'Mythic', radiant:'Radiant' };

// ===== INIT =====
function init() {
  try { animes = JSON.parse(localStorage.getItem('acg_data')) || []; } catch(e) { animes = []; }
  // migrate old key
  if (!animes.length) {
    try { const old = JSON.parse(localStorage.getItem('animes')); if (Array.isArray(old) && old.length) { animes = old; save(); } } catch(e) {}
  }
  renderAnimes();
  updateHeroStats();
  updateSuggestions();
  // restore saved mode
  const savedMode = localStorage.getItem('acg_mode');
  if (savedMode && savedMode !== 'normal') { currentMode = savedMode; applyMode(); }
}

function save() { localStorage.setItem('acg_data', JSON.stringify(animes)); }

// ===== TOAST =====
let toastTimer;
function toast(msg, color, duration) {
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.style.borderColor = color || 'var(--border2)';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), duration || 2800);
}

// ===== PAGE NAV =====
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goBack() { showPage('pgMain'); renderAnimes(); updateHeroStats(); currentAnime = null; }

// ===== HERO STATS =====
function updateHeroStats() {
  let tc=0, to=0, ts=0, ta=animes.length;
  animes.forEach(a => a.cards.forEach(c => { if(!c) return; tc++; if(c.obtained) to++; if(c.shiny&&c.obtained) ts++; }));
  const pct = tc ? Math.round(to/tc*100) : 0;
  const lvl = getCollectorLevel(tc, to, ts, ta);
  document.getElementById('heroStats').innerHTML = `
    <div class="hero-card c-cyan"><div class="num">${ta}</div><div class="lbl">Animes</div></div>
    <div class="hero-card c-cyan"><div class="num">${tc}</div><div class="lbl">Cartas totales</div></div>
    <div class="hero-card c-green"><div class="num">${to}</div><div class="lbl">Obtenidas</div></div>
    <div class="hero-card c-gold"><div class="num">${ts}</div><div class="lbl">Shiny ✨</div></div>
    <div class="hero-card" style="grid-column:span 2 / auto;">
      <div class="lbl" style="text-align:left;margin-bottom:4px;">Progreso global — <b style="color:var(--cyan)">${pct}%</b></div>
      <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
    </div>`;
  // Collector level card
  const clEl = document.getElementById('collectorLevel');
  if (clEl) clEl.innerHTML = `<span class="cl-icon">${lvl.icon}</span><div class="cl-info"><div class="cl-title">${lvl.title}</div><div class="cl-sub">${lvl.sub} · ${tc} cartas · ${ta} series</div></div>`;
  if (currentMode === 'pro' || currentMode === 'deluxe') renderProQuickPanel();
}

// ===== ANIME FORM =====
function openAnimeForm(idx) {
  editingAnime = idx !== undefined ? idx : null;
  const modal = document.getElementById('animeFormModal');
  if (editingAnime !== null) {
    const a = animes[editingAnime];
    document.getElementById('fAnimeName').value = a.name;
    document.getElementById('fAnimeImg').value = a.img || '';
    document.getElementById('fAnimeTag').value = a.tag || '';
    document.getElementById('animeFormTitle').textContent = '✏️ Editar Anime';
    showPreview('fAnimeImg', 'fAnimePreview');
  } else {
    document.getElementById('fAnimeName').value = '';
    document.getElementById('fAnimeImg').value = '';
    document.getElementById('fAnimeTag').value = '';
    document.getElementById('fAnimePreview').style.display = 'none';
    document.getElementById('animeFormTitle').textContent = '➕ Nuevo Anime';
  }
  modal.style.display = 'flex';
  setTimeout(() => document.getElementById('fAnimeName').focus(), 50);
}
function closeAnimeForm() { document.getElementById('animeFormModal').style.display = 'none'; }
function saveAnime() {
  const name = document.getElementById('fAnimeName').value.trim();
  const img = document.getElementById('fAnimeImg').value.trim();
  const tag = document.getElementById('fAnimeTag').value.trim();
  if (!name) { toast('⚠️ Escribe un nombre', '#e53935'); return; }
  if (editingAnime !== null) {
    animes[editingAnime].name = name;
    animes[editingAnime].img = img;
    animes[editingAnime].tag = tag;
    toast('✅ Anime editado');
  } else {
    animes.push({ name, img, tag, cards: [], createdAt: Date.now() });
    toast('✅ Anime agregado');
  }
  save(); closeAnimeForm(); renderAnimes(); updateHeroStats();
}
function editCurrentAnime() { openAnimeForm(currentAnime); }
function deleteAnime(i) {
  confirm2(`¿Eliminar "${animes[i].name}" y todas sus cartas?`, () => {
    animes.splice(i,1);
    save(); renderAnimes(); updateHeroStats();
    toast('🗑 Anime eliminado', '#e53935');
  });
}
function showPreview(inputId, previewId) {
  const v = document.getElementById(inputId).value.trim();
  const el = document.getElementById(previewId);
  if (v) { el.src = v; el.style.display = 'block'; el.onerror = () => el.style.display = 'none'; }
  else { el.style.display = 'none'; }
}

// ===== RENDER ANIMES =====
function renderAnimes() {
  const grid = document.getElementById('animeGrid');
  const q = document.getElementById('srchAnime').value.toLowerCase();
  const sort = document.getElementById('sortAnime').value;
  let list = animes.map((a,i) => ({...a, _i:i})).filter(a => a.name.toLowerCase().includes(q));
  if (sort === 'az') list.sort((a,b) => a.name.localeCompare(b.name));
  else if (sort === 'progress') list.sort((a,b) => animeProgress(b._i) - animeProgress(a._i));
  else if (sort === 'total') list.sort((a,b) => b.cards.length - a.cards.length);
  grid.innerHTML = '';
  if (!list.length) { grid.innerHTML = '<div class="empty">Sin animes aún. ¡Agrega uno!</div>'; return; }
  list.forEach(a => {
    const i = a._i;
    const total = animes[i].cards.filter(c=>c).length;
    const done = animes[i].cards.filter(c=>c&&c.obtained).length;
    const pct = total ? Math.round(done/total*100) : 0;
    const isComplete = total > 0 && done === total;
    const wishCount = animes[i].cards.filter(c=>c&&c.wishlist&&!c.obtained).length;
    const lastCard = animes[i].cards.filter(c=>c&&c.addedAt).sort((a,b)=>b.addedAt-a.addedAt)[0];
    const lastAct = lastCard ? timeAgo(lastCard.addedAt) : null;
    const div = document.createElement('div');
    div.className = 'anime-card' + (isComplete ? ' completed' : '');
    div.innerHTML = `
      <img src="${a.img||''}" onerror="this.src=''" alt="${a.name}" loading="lazy">
      <div class="ac-body">
        <div class="ac-name" title="${a.name}">${a.name}</div>
        <div class="ac-prog">${done}/${total} cartas · ${pct}%${wishCount?` · ⭐${wishCount}`:''}</div>
        ${lastAct?`<div style="font-size:10px;color:var(--text3);margin-bottom:2px;">🕐 ${lastAct}</div>`:''}
        <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
        <div class="ac-actions">
          <button class="btn btn-sm btn-icon" onclick="event.stopPropagation();openAnimeForm(${i})">✏️</button>
          ${a.tag ? `<button class="btn btn-sm btn-icon" title="Copiar tag: ${a.tag}" onclick="event.stopPropagation();copyTag('${a.tag}',this)">📋</button>` : ''}
          <button class="btn btn-sm btn-icon btn-danger" onclick="event.stopPropagation();deleteAnime(${i})">🗑</button>
        </div>
      </div>`;
    div.onclick = e => { if (e.target.tagName !== 'BUTTON') openAnime(i); };
    grid.appendChild(div);
  });
}

function animeProgress(i) {
  const a = animes[i];
  const total = a.cards.filter(c=>c).length;
  const done = a.cards.filter(c=>c&&c.obtained).length;
  return total ? done/total : 0;
}

// ===== OPEN ANIME =====
function openAnime(i) {
  currentAnime = i;
  filters = { missing: false, shiny: false, obtained: false, wishlist: false, dups: false, needsImage: false };
  ['chipMissing','chipShiny','chipObtained','chipWishlist','chipDups','chipNeedsImage'].forEach(id => { const el=document.getElementById(id); if(el) el.classList.remove('on'); });
  document.getElementById('flRarity').value = '';
  document.getElementById('flType').value = '';
  document.getElementById('sortCards').value = 'default';
  document.getElementById('avTitle').textContent = animes[i].name;
  document.getElementById('avImg').src = animes[i].img || '';
  showPage('pgAnime');
  switchTab('col', document.querySelector('.tab'));
}

// ===== TABS =====
function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  ['tabCol','tabStats','tabAddcard','tabHistory'].forEach(id => document.getElementById(id).style.display = 'none');
  if (tab === 'col') { document.getElementById('tabCol').style.display = 'block'; renderCards(); }
  if (tab === 'stats') { document.getElementById('tabStats').style.display = 'block'; renderStats(); }
  if (tab === 'addcard') { document.getElementById('tabAddcard').style.display = 'block'; }
  if (tab === 'history') { document.getElementById('tabHistory').style.display = 'block'; renderHistory(); }
}

// ===== FILTER CHIPS =====
function toggleChip(key) {
  filters[key] = !filters[key];
  if (key === 'missing' && filters.missing) { filters.obtained = false; document.getElementById('chipObtained').classList.remove('on'); }
  if (key === 'obtained' && filters.obtained) { filters.missing = false; document.getElementById('chipMissing').classList.remove('on'); }
  const id = 'chip' + key.charAt(0).toUpperCase() + key.slice(1);
  if (document.getElementById(id)) document.getElementById(id).classList.toggle('on', filters[key]);
  renderCards();
}

// ===== VIEW TOGGLE =====
function setView(v, btn) {
  cardView = v;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

// ===== CARD FORM =====
function previewCardImg() {
  const v = document.getElementById('fCardImg').value.trim();
  const wrap = document.getElementById('cardImgPreview');
  const img = document.getElementById('cardPreviewImg');
  if (v) { img.src = v; wrap.style.display = 'block'; img.onerror = () => wrap.style.display = 'none'; }
  else { wrap.style.display = 'none'; }
}

function saveCard() {
  if (editingCard === null) autoName();
  const name = document.getElementById('fCardName').value.trim();
  if (!name) { toast('⚠️ Escribe un nombre', '#e53935'); return; }
  const card = {
    name,
    img: document.getElementById('fCardImg').value.trim(),
    type: document.getElementById('fCardType').value,
    rarity: document.getElementById('fCardRarity').value,
    shiny: document.getElementById('fCardShiny').checked,
    obtained: document.getElementById('fCardObtained').checked,
    power: Math.min(100, Math.max(1, parseInt(document.getElementById('fCardPower').value) || 1)),
    code: document.getElementById('fCardCode').value.trim() || '',
    note: document.getElementById('fCardNote').value.trim() || '',
    addedAt: Date.now()
  };
  if (editingCard !== null) {
    // preserve existing fields not in form, clear needsImage since user is reviewing
    card.addedAt = animes[currentAnime].cards[editingCard].addedAt || Date.now();
    card.wishlist = animes[currentAnime].cards[editingCard].wishlist || false;
    card.needsImage = false;
  }
  if (editingCard !== null) {
    animes[currentAnime].cards[editingCard] = { ...animes[currentAnime].cards[editingCard], ...card };
    editingCard = null;
    document.getElementById('cardFormTitle').textContent = '➕ Nueva Carta';

// ===== AUTO NAME =====
function autoName() {
  const inp = document.getElementById('fCardName');
  const type = document.getElementById('fCardType').value;
  let base = inp.value.trim().replace(/\s(Ed\s*\d+|Poster\s*\d*|3D\s*\d*|Event\s*\d*)$/i,'').trim();
  const suffix = { normal:'Ed', '3d':'3D', poster:'Poster', events:'Event' }[type] || '';
  if (type === 'normal') {
    let n = 0;
    animes.forEach(a => a.cards.forEach(c => { if(c&&c.name&&new RegExp(`^${base}( Ed \\d+)?$`,'i').test(c.name)) n++; }));
    inp.value = n === 0 ? base : `${base} Ed ${n+1}`;
  } else {
    let n = 0;
    animes.forEach(a => a.cards.forEach(c => { if(c&&c.name&&new RegExp(`^${base} ${suffix}( \\d+)?$`,'i').test(c.name)) n++; }));
    inp.value = n === 0 ? `${base} ${suffix}` : `${base} ${suffix} ${n+1}`;
  }
}

// ===== RENDER CARDS =====
function getFilteredCards(type) {
  const q = document.getElementById('srchCard').value.toLowerCase();
  const flR = document.getElementById('flRarity').value;
  const flT = document.getElementById('flType').value;
  const sort = document.getElementById('sortCards').value;
  // Build name counts for dup detection
  const nameCounts = {};
  animes[currentAnime].cards.forEach(c => { if(c&&c.name) nameCounts[c.name.toLowerCase()] = (nameCounts[c.name.toLowerCase()]||0)+1; });
  let arr = animes[currentAnime].cards.map((c,i) => ({...c, _i:i})).filter(c => {
    if (!c||!c.name) return false;
    if (type && c.type !== type) return false;
    if (flT && c.type !== flT) return false;
    if (!c.name.toLowerCase().includes(q)) return false;
    if (filters.missing && c.obtained) return false;
    if (filters.shiny && !c.shiny) return false;
    if (filters.obtained && !c.obtained) return false;
    if (filters.wishlist && !c.wishlist) return false;
    if (filters.dups && (nameCounts[c.name.toLowerCase()]||0) < 2) return false;
    if (filters.needsImage && !c.needsImage) return false;
    if (flR && c.rarity !== flR) return false;
    return true;
  });
  if (sort === 'az') arr.sort((a,b) => a.name.localeCompare(b.name));
  else if (sort === 'power-d') arr.sort((a,b) => b.power-a.power);
  else if (sort === 'power-a') arr.sort((a,b) => a.power-b.power);
  else if (sort === 'rarity-d') arr.sort((a,b) => RARITY_RANK[b.rarity]-RARITY_RANK[a.rarity]);
  else if (sort === 'obtained') arr.sort((a,b) => (b.obtained?1:0)-(a.obtained?1:0));
  return arr;
}

function pwrColor(p) {
  if (p<=10) return '#c340ff';
  if (p<=25) return '#00e5ff';
  if (p<=50) return '#ffd700';
  if (p<=75) return '#c0c0c0';
  return '#cd7f32';
}
function pwrBarClass(p) {
  if (p<=10) return 'mythic-bar';
  if (p<=25) return 'cyan-bar';
  if (p<=50) return 'gold-bar';
  if (p<=75) return 'silver-bar';
  return 'bronze-bar';
}

function renderCards() {
  const cont = document.getElementById('cardsContainer');
  cont.innerHTML = '';
  const flType = document.getElementById('flType').value;
  const sections = flType ? [[flType, {normal:'🟦 NORMALES','3d':'🟥 3D',poster:'🟨 POSTERS',events:'🟪 EVENTS'}[flType]||flType]] :
    [['normal','🟦 NORMALES'],['3d','🟥 3D'],['poster','🟨 POSTERS'],['events','🟪 EVENTS']];

  sections.forEach(([type, label]) => {
    const allOfType = animes[currentAnime].cards.filter(c=>c&&c.type===type);
    if (!allOfType.length) return;
    const visible = getFilteredCards(type);
    const done = allOfType.filter(c=>c.obtained).length;
    const pct = allOfType.length ? Math.round(done/allOfType.length*100) : 0;

    const sec = document.createElement('div');
    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `<span class="sh-title">${label}</span>
      <span class="sh-count">${done}/${allOfType.length}</span>
      <span class="sh-pct">(${pct}%)</span>
      <div style="flex:1;margin:0 8px;"><div class="pbar" style="height:5px;"><div class="pfill" style="width:${pct}%"></div></div></div>
      <span class="sh-arrow">▾</span>`;
    const body = document.createElement('div');
    body.className = cardView === 'grid' ? 'section-body' : '';

    let collapsed = localStorage.getItem('sec_' + type) === '1';
    if (collapsed) { body.classList.add('hidden'); head.classList.add('collapsed'); }

    head.onclick = () => {
      const isHidden = body.classList.toggle('hidden');
      head.classList.toggle('collapsed', isHidden);
      localStorage.setItem('sec_' + type, isHidden ? '1' : '0');
    };
    sec.appendChild(head); sec.appendChild(body);
    cont.appendChild(sec);

    if (!visible.length) {
      body.innerHTML = '<div class="empty" style="padding:14px;">Sin resultados para este filtro</div>';
      return;
    }
    visible.forEach(c => { body.appendChild(cardView === 'grid' ? makeCardEl(c) : makeListItem(c)); });
  });
}

// ===== DRAG & DROP =====
function addDrag(el) {
  el.addEventListener('dragstart', e => { dragSrc = el.dataset.index; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  el.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; });
  el.addEventListener('drop', e => {
    e.preventDefault();
    const from = parseInt(dragSrc), to = parseInt(el.dataset.index);
    if (isNaN(from)||isNaN(to)||from===to) return;
    const arr = animes[currentAnime].cards;
    arr.splice(to, 0, arr.splice(from,1)[0]);
    save(); renderCards();
  });
}

function importData(e) {

  const r=new FileReader();

    try {
      const data=JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw 'bad';

      toast(`✅ Importados ${data.length} animes`);
    } catch { toast('❌ Archivo inválido','#e53935'); }

}
// Función para procesar el mensaje de Fuuka Bot
function processFuukaMessage() {
  const inputEl = document.getElementById('fuukaInput');
  const input = inputEl.value.trim();
  
  if (!input) return toast('⚠️ El campo está vacío', '#e53935');

  const lineRegex = /`(\d+)`\s*•\s*\S+\s*•\s*`([^`]+)`\s*•\s*([^•]+)•\s*\*\*([^*]+)\*\*\s*•\s*_(.*?)_/;
  const lines = input.split('\n');
  let added = 0;
  let updated = 0;
  let skipped = 0;
  let errors = 0;
  const importedCards = [];
  lastRejectedCodes = []; // resetear en cada importación

  lines.forEach((line) => {
    const cleanLine = line.trim();
    if (!cleanLine) return;

    const match = cleanLine.match(lineRegex);
    if (match) {
      const power = parseInt(match[1]);
      const cardCode = match[2].trim();
      const emojiRareza = match[3].trim();
      const charName = match[4].trim();
      const seriesName = match[5].trim();

      let rarity = 'bronze';
      if (emojiRareza.includes('⚪')) rarity = 'silver';
      else if (emojiRareza.includes('🟡')) rarity = 'gold';
      else if (emojiRareza.includes('🔵')) rarity = 'diamond';
      else if (emojiRareza.includes('🟣')) rarity = 'mythic';

      let animeIdx = animes.findIndex(a => a.name.toLowerCase() === seriesName.toLowerCase());
      if (animeIdx === -1) {
        animes.push({ name: seriesName, img: '', tag: '', cards: [], createdAt: Date.now() });
        animeIdx = animes.length - 1;
      }

      const cards = animes[animeIdx].cards;

      // Caso 1: misma carta por código exacto → rareza tiene prioridad absoluta; poder solo se compara si rareza es igual
      const byCodeIdx = cards.findIndex(c => c && c.code && c.code === cardCode);
      if (byCodeIdx !== -1) {
        const old = cards[byCodeIdx];
        const oldRarityRank = RARITY_RANK[old.rarity] || 0;
        const newRarityRank = RARITY_RANK[rarity] || 0;
        const rarityBetter = newRarityRank > oldRarityRank;
        const rarityWorse = newRarityRank < oldRarityRank;
        if (rarityWorse) {
          // mismo código → no copiar al clipboard (es la misma carta física)
          skipped++;
          importedCards.push({ name: charName, series: seriesName, rarity, power, status: 'dup' });
          return;
        }
        const powerBetter = power < old.power;
        if (rarityBetter || powerBetter) {
          const oldRarity = old.rarity;
          const oldPower = old.power;
          cards[byCodeIdx].rarity = rarityBetter ? rarity : old.rarity;
          cards[byCodeIdx].power = (rarityBetter || powerBetter) ? power : old.power;
          cards[byCodeIdx].needsImage = true;
          updated++;
          importedCards.push({ name: charName, series: seriesName, rarity: cards[byCodeIdx].rarity, power: cards[byCodeIdx].power, status: 'updated', oldRarity, oldPower, code: cardCode });
        } else {
          // mismo código, existente ya es igual o mejor → no copiar al clipboard
          skipped++;
          importedCards.push({ name: charName, series: seriesName, rarity, power, status: 'dup' });
        }
        return;
      }

      // Caso 2: mismo nombre, diferente código (o sin código) → rareza tiene prioridad absoluta; poder solo se compara si rareza es igual
      const byNameIdx = cards.findIndex(c => c && c.name && c.name.toLowerCase() === charName.toLowerCase());
      if (byNameIdx !== -1) {
        const existing = cards[byNameIdx];
        const existingRank = RARITY_RANK[existing.rarity] || 0;
        const newRank = RARITY_RANK[rarity] || 0;
        const rarityBetter = newRank > existingRank;
        const rarityWorse = newRank < existingRank;
        const powerBetter = power < existing.power;

        // Si la existente no tiene código, asignarle el código que llegó siempre
        const existingHasNoCode = !existing.code;

        if (rarityWorse) {
          // la nueva es de menor rareza → no cambia nada
          const codeAlreadyExists = cards.some(c => c && c.code && c.code === cardCode);
          if (cardCode && !codeAlreadyExists) lastRejectedCodes.push(cardCode);
          skipped++;
          importedCards.push({ name: charName, series: seriesName, rarity, power, status: 'dup' });
          return;
        }

        if (rarityBetter || powerBetter) {
          const oldRarity = existing.rarity;
          const oldPower = existing.power;
          const oldCode = existing.code || '';
          cards[byNameIdx].rarity = rarityBetter ? rarity : existing.rarity;
          cards[byNameIdx].power = (rarityBetter || powerBetter) ? power : existing.power;
          cards[byNameIdx].code = cardCode;
          cards[byNameIdx].needsImage = true;
          updated++;
          importedCards.push({ name: charName, series: seriesName, rarity: cards[byNameIdx].rarity, power: cards[byNameIdx].power, status: 'updated', oldRarity, oldPower, oldCode, code: cardCode });
        } else {
          // misma rareza, poder igual o peor
          const sameEverything = (rarity === existing.rarity && power === existing.power);
          if (existingHasNoCode && cardCode && sameEverything) {
            // exactamente igual pero sin código → solo poner el código
            cards[byNameIdx].code = cardCode;
            updated++;
            importedCards.push({ name: charName, series: seriesName, rarity: existing.rarity, power: existing.power, status: 'updated', oldRarity: existing.rarity, oldPower: existing.power, oldCode: '', code: cardCode });
          } else {
            // peor en poder → rechazar
            const codeAlreadyExists = cards.some(c => c && c.code && c.code === cardCode);
            if (cardCode && !codeAlreadyExists) lastRejectedCodes.push(cardCode);
            skipped++;
            importedCards.push({ name: charName, series: seriesName, rarity, power, status: 'dup' });
          }
        }
        return;
      }

      // Caso 3: carta nueva
      cards.push({
        name: charName,
        img: '',
        type: 'normal',
        rarity,
        shiny: false,
        obtained: true,
        power,
        code: cardCode,
        needsImage: false,
        addedAt: Date.now()
      });
      added++;
      importedCards.push({ name: charName, series: seriesName, rarity, power, status: 'new', code: cardCode });
    } else {
      errors++;
    }
  });

  if (added > 0 || updated > 0 || skipped > 0) {
    save();

    const histKey = 'acg_history';
    let history = [];
    try { history = JSON.parse(localStorage.getItem(histKey)) || []; } catch(e) {}
    history.unshift({ date: Date.now(), added, updated, skipped, errors, cards: importedCards });
    if (history.length > 100) history = history.slice(0, 100);
    localStorage.setItem(histKey, JSON.stringify(history));

    renderAnimes();
    if (typeof updateHeroStats === 'function') updateHeroStats();
    inputEl.value = '';

    // Actualizar botón "Copiar repetidas"
    const rejBtn = document.getElementById('btnCopyRejected');
    if (lastRejectedCodes.length > 0) {
      rejBtn.style.opacity = '1';
      rejBtn.style.cursor = 'pointer';
      rejBtn.title = `ft r ${lastRejectedCodes.join(', ')}`;
    } else {
      rejBtn.style.opacity = '0.4';
      rejBtn.style.cursor = 'default';
      rejBtn.title = 'Sin repetidas en esta importación';
    }

    let msg = '';
    if (added > 0) msg += `✅ +${added} nueva${added>1?'s':''}`;
    if (updated > 0) msg += `${msg?' · ':''}🔄 ${updated} actualizada${updated>1?'s':''}`;
    if (skipped > 0) msg += `${msg?' · ':''}⏭ ${skipped} sin cambio`;
    if (lastRejectedCodes.length > 0) msg += `${msg?' · ':''}⚠️ ${lastRejectedCodes.length} repetida${lastRejectedCodes.length>1?'s':''} (copiar arriba)`;
    if (errors > 0) msg += ` · ❌ ${errors} sin formato`;
    const hasWarning = skipped > 0 || errors > 0;
    toast(msg, updated > 0 ? 'var(--cyan)' : hasWarning ? 'var(--gold)' : 'var(--green)', 4000);
  } else if (errors > 0) {
    toast(`❌ Formato no reconocido (${errors} línea${errors>1?'s':''})`, '#e53935', 4000);
  } else {
    toast('⚠️ No se encontraron cartas', 'var(--gold)');
  }
}

function copyToClipboard(text, onSuccess, onFail) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(onSuccess).catch(() => {
      // fallback
      try { fallbackCopy(text); onSuccess(); } catch(e) { if(onFail) onFail(); }
    });
  } else {
    try { fallbackCopy(text); onSuccess(); } catch(e) { if(onFail) onFail(); }
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
}

        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.4rem;background:linear-gradient(135deg,#bf00ff,#7000ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">${animes.length}</div>
        <div style="font-size:9px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text3);">Animes</div>
      </div>
    </div>
    ${topPower || bestAnime ? `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;font-size:11px;font-family:'Space Grotesk',sans-serif;">
      ${topPower?`<span style="background:rgba(112,0,255,0.1);border:1px solid rgba(112,0,255,0.25);border-radius:8px;padding:3px 10px;color:#c080ff;">💪 ${topPower.name} · <b>${topPower.power}</b> PWR</span>`:''}
      ${topRarity?`<span style="background:rgba(191,0,255,0.08);border:1px solid rgba(191,0,255,0.2);border-radius:8px;padding:3px 10px;color:#bf00ff;">${rarityIcons[topRarity.rarity]||''} ${topRarity.name}</span>`:''}
      ${bestAnime?`<span style="background:rgba(0,255,136,0.06);border:1px solid rgba(0,255,136,0.15);border-radius:8px;padding:3px 10px;color:#00ff88;">🏆 ${bestAnime} · ${Math.round(bestPct*100)}%</span>`:''}
    </div>` : ''}`;
}

// Keep old function name for compatibility
function toggleImprovedMode() { cycleMode(); }

// ===== TIME AGO =====
function timeAgo(ts) {
  const s = Math.floor((Date.now()-ts)/1000);
  if (s < 60) return 'hace un momento';
  if (s < 3600) return `hace ${Math.floor(s/60)}m`;
  if (s < 86400) return `hace ${Math.floor(s/3600)}h`;
  if (s < 604800) return `hace ${Math.floor(s/86400)}d`;
  return new Date(ts).toLocaleDateString('es-CO',{day:'2-digit',month:'short'});
}

// ===== WISHLIST =====
function toggleWishlist(i) {
  animes[currentAnime].cards[i].wishlist = !animes[currentAnime].cards[i].wishlist;
  save(); renderCards();
  toast(animes[currentAnime].cards[i].wishlist ? '⭐ Agregada a wishlist' : '☆ Quitada de wishlist', 'var(--gold)', 1800);
}

// ===== BULK MODE =====
function toggleBulkMode() {
  bulkMode = !bulkMode;
  bulkSelected.clear();
  const btn = document.getElementById('bulkModeBtn');
  btn.style.borderColor = bulkMode ? 'var(--cyan)' : '';
  btn.style.color = bulkMode ? 'var(--cyan)' : '';
  document.getElementById('bulkBar').classList.toggle('visible', bulkMode);
  renderCards();
}
function toggleBulkCard(i, div) {
  if (bulkSelected.has(i)) { bulkSelected.delete(i); div.classList.remove('bulk-selected'); }
  else { bulkSelected.add(i); div.classList.add('bulk-selected'); }
  document.getElementById('bulkCount').textContent = `${bulkSelected.size} seleccionada${bulkSelected.size!==1?'s':''}`;
}
function clearBulkSelection() { bulkSelected.clear(); renderCards(); document.getElementById('bulkCount').textContent = '0 seleccionadas'; }
function bulkMarkObtained() {
  if (!bulkSelected.size) return;
  bulkSelected.forEach(i => { if(animes[currentAnime].cards[i]) animes[currentAnime].cards[i].obtained = true; });
  save(); updateHeroStats(); clearBulkSelection();
  toast(`✅ ${bulkSelected.size||'Varias'} marcadas como obtenidas`);
}
function bulkMarkWishlist() {
  if (!bulkSelected.size) return;
  bulkSelected.forEach(i => { if(animes[currentAnime].cards[i]) animes[currentAnime].cards[i].wishlist = true; });
  save(); clearBulkSelection();
  toast('⭐ Agregadas a wishlist', 'var(--gold)');
}
function bulkDelete() {
  if (!bulkSelected.size) return;
  confirm2(`¿Eliminar ${bulkSelected.size} carta${bulkSelected.size!==1?'s':''}?`, () => {
    const toDelete = [...bulkSelected].sort((a,b)=>b-a);
    toDelete.forEach(i => animes[currentAnime].cards.splice(i,1));
    save(); updateHeroStats(); clearBulkSelection();
    toast(`🗑 ${toDelete.length} carta${toDelete.length!==1?'s':''} eliminadas`, '#e53935');
  });
}

// ===== GLOBAL SEARCH =====
function openGlobalSearch() {
  document.getElementById('globalSearchModal').style.display = 'flex';
  document.getElementById('globalSearchInput').value = '';
  document.getElementById('globalSearchResults').innerHTML = '<div class="empty">Escribe para buscar en toda tu colección...</div>';
  setTimeout(() => document.getElementById('globalSearchInput').focus(), 50);
}
function renderGlobalSearch() {
  const q = document.getElementById('globalSearchInput').value.toLowerCase().trim();
  const cont = document.getElementById('globalSearchResults');
  if (q.length < 2) { cont.innerHTML = '<div class="empty">Escribe al menos 2 caracteres...</div>'; return; }
  const results = [];
  animes.forEach((a, ai) => {
    a.cards.forEach((c, ci) => {
      if (!c||!c.name) return;
      if (c.name.toLowerCase().includes(q) || (a.name.toLowerCase().includes(q))) {
        results.push({ ...c, _ai: ai, _ci: ci, animeName: a.name, animeImg: a.img });
      }
    });
  });
  results.sort((a,b) => (RARITY_RANK[b.rarity]||0)-(RARITY_RANK[a.rarity]||0));
  if (!results.length) { cont.innerHTML = '<div class="empty">Sin resultados</div>'; return; }
  cont.innerHTML = '';
  results.slice(0,50).forEach(c => {
    const d = document.createElement('div');
    d.className = 'gsr-item';
    d.innerHTML = `
      <img class="gsr-img ${c.obtained?'':'gray'}" src="${c.img||''}" onerror="this.src=''" alt="">
      <div class="gsr-info">
        <div class="gsr-name">${c.name}${c.shiny?' ✨':''}${c.wishlist?' ⭐':''}</div>
        <div class="gsr-meta"><span class="rbd ${c.rarity}">${RARITY_LABELS[c.rarity]}</span> · ⚡${c.power} · ${c.animeName} · ${c.obtained?'<span style="color:var(--green)">✓</span>':'<span style="color:var(--text3)">Faltante</span>'}</div>
      </div>
      ${c.code?`<button class="btn btn-sm btn-icon" onclick="event.stopPropagation();copyCode('${c.code}',this)" title="fv ${c.code}">📋</button>`:''}`;
    d.onclick = () => { document.getElementById('globalSearchModal').style.display='none'; openAnime(c._ai); };
    cont.appendChild(d);
  });
  if (results.length > 50) cont.insertAdjacentHTML('beforeend', `<div class="empty" style="padding:8px;">... y ${results.length-50} más</div>`);
}

// ===== RANKING GLOBAL =====
function openRanking() {
  document.getElementById('rankingModal').style.display = 'flex';
  renderRanking();
}
function renderRanking() {
  const filter = document.getElementById('rankFilter').value;
  let all = [];
  animes.forEach((a, ai) => {
    a.cards.forEach((c, ci) => {
      if (!c||!c.name) return;
      if (filter === 'obtained' && !c.obtained) return;
      if (['radiant','mythic','diamond','gold','silver','bronze'].includes(filter) && c.rarity !== filter) return;
      all.push({ ...c, _ai: ai, _ci: ci, animeName: a.name });
    });
  });
  all.sort((a,b) => a.power - b.power);
  const cont = document.getElementById('rankingList');
  if (!all.length) { cont.innerHTML = '<div class="empty">Sin cartas</div>'; return; }
  const medalColors = ['#ffd700','#c0c0c0','#cd7f32'];
  cont.innerHTML = all.slice(0,100).map((c,idx) => `
    <div class="rank-item">
      <span class="rank-num" style="color:${idx<3?medalColors[idx]:'var(--text3)'};">${idx<3?['🥇','🥈','🥉'][idx]:idx+1}</span>
      <img class="rank-img ${c.obtained?'':'gray'}" src="${c.img||''}" onerror="this.src=''" alt="">
      <div style="flex:1;min-width:0;">
        <div class="rank-name">${c.name}${c.shiny?' ✨':''}</div>
        <div style="font-size:10px;color:var(--text2);"><span class="rbd ${c.rarity}">${RARITY_LABELS[c.rarity]}</span> · ${c.animeName}</div>
      </div>
      <span class="rank-pwr" style="color:${pwrColor(c.power)};">⚡${c.power}</span>
      ${c.code?`<button class="btn btn-sm btn-icon" onclick="copyCode('${c.code}',this)" title="fv ${c.code}">📋</button>`:''}
    </div>`).join('');
}

// ===== COLLECTOR LEVEL =====
function getCollectorLevel(tc, to, ts, ta) {
  const pct = tc ? to/tc : 0;
  const score = to + ts*3 + ta*2 + Math.round(pct*50);
  if (score >= 500) return { icon:'👑', title:'Coleccionista Legendario', sub:`Score: ${score}` };
  if (score >= 300) return { icon:'💎', title:'Maestro Coleccionista', sub:`Score: ${score}` };
  if (score >= 150) return { icon:'🏆', title:'Coleccionista Experto', sub:`Score: ${score}` };
  if (score >= 75)  return { icon:'⭐', title:'Coleccionista Avanzado', sub:`Score: ${score}` };
  if (score >= 30)  return { icon:'📚', title:'Coleccionista Intermedio', sub:`Score: ${score}` };
  return { icon:'🌱', title:'Coleccionista Novato', sub:`Score: ${score}` };
}


document.addEventListener('keydown', e => {
  if (e.key==='Escape') {
    document.getElementById('cardModal').style.display='none';
    document.getElementById('animeFormModal').style.display='none';
    document.querySelectorAll('.confirm-overlay').forEach(d=>d.remove());
  }
});

init();
